 как покупки в дьюти-фри\",\"text6_2\":\"не могу без тебя жить\",\"text7_1\":\"Ты как кругосветка\",\"text7_2\":\"все мечтают о тебе\",\"text8_1\":\"Ты как стакан воды в самолёте\",\"text8_2\":\"спасибо, что ты есть\",\"text9_1\":\"Спасибо, что тыкнул!\",\"text9_2\":\"Ты супер!\",\"text10_1\":\"Что??? Зачем???\",\"text10_2\":\"Ну спасибо!!!\",\"text11_1\":\"Спасибо, что тыкнул!\",\"text11_2\":\"Но с другими кнопочками поосторожнее!\",\"text12_1\":\"Ты как первый за 5 лет отпуск\",\"text12_2\":\"не верю, что встретил тебя\",\"text13_1\":\"Ты как путёвка в санаторий\",\"text13_2\":\"неожиданно, но очень приятно\",\"text14_1\":\"Ты — чемодан, мы — калибратор\",\"text14_2\":\"идеально друг другу подходим!\",\"text15_1\":\"Ты как завтрак в отеле\",\"text15_2\":\"ради тебя проснусь в 7 утра\",\"text16_1\":\"Ты как бизнес-класс\",\"text16_2\":\"с тобой всегда роскошно\",\"text17_1\":\"Ты как шенген\",\"text17_2\":\"открываешь новые горизонты\",\"text18_1\":\"Ты как зимовка на Бали\",\"text18_2\":\"в тебя влюблены все айтишники (и мы)\",\"text19_1\":\"Ты как первый класс\",\"text19_2\":\"после тебя к другим не вернусь\",\"text20_1\":\"Ты как бархатный сезон\",\"text20_2\":\"только для самых прошаренных\",\"text21_1\":\"Ты как плед от стюардессы\",\"text21_2\":\"без тебя не заснуть\"},\"information\":\"Информация\",\"popularDirections\":\"Популярные направления\",\"privacy\":\"Политика конфиденциальности\",\"privacyModal\":\"Конфиденциальность\",\"security\":\"Безопасность\",\"securityModal\":\"Безопасность платежей\",\"slogan\":\"Дешевые авиабилеты, бронирование и онлайн-заказ\",\"terms\":\"Оферта\",\"travelGuide\":\"Путеводитель\",\"kupicomSlogan\":\"From Anywhere to Everywhere\"},\"layoutCommon\":{\"loading\":\"Загрузка...\",\"close\":\"Закрыть\",\"downloadDocument\":\"Скачать документ\",\"error\":\"Ошибка\",\"scrollToTop\":\"Наверх\",\"documentUnavailable\":\"Документ недоступен\",\"errorService\":\"Не можем получить информацию от сервиса\",\"retry\":\"Попробовать снова\ ездку на это время.\",\"transfer\":\"Прямых рейсов на маршруте нет — сравните варианты с разными пересадками: стыковка добавляет немного времени, но заметно снижает цену.\",\"transferVia\":\"Прямых рейсов нет — обычно летят через {via}. Сравните варианты с разными пересадками: стыковка добавляет времени, но снижает цену.\",\"directCompare\":\"Сравнивайте прямые и стыковочные рейсы: прямой быстрее, а рейс с пересадкой иногда ощутимо дешевле.\",\"airportsChoice\":\"У города {from} несколько аэропортов — перед покупкой сравните цены и время в дороге до каждого.\",\"tools\":\"Следите за \u003clpc\u003eкалендарём низких цен\u003c/lpc\u003e и \u003cdyn\u003eдинамикой цен по месяцам\u003c/dyn\u003e на этой странице — так проще поймать выгодную дату.\",\"handLuggage\":\"Летите налегке — выбирайте тариф только с ручной кладью: без багажа билеты заметно дешевле.\",\"arriveEarly\":\"Приезжайте в аэропорт заранее — примерно за 2–3 часа до международного вылета и за час до внутреннего.\"},\"airlinesIntro\":{\"base\":\"Рейсы по маршруту {from} — {to} выполняют {airlines}\",\"leader\":\"; больше всего рейсов у \u003cleader\u003e{leaderName}\u003c/leader\u003e\",\"leaderShare\":\"; больше всего рейсов у \u003cleader\u003e{leaderName}\u003c/leader\u003e (около {share}% всех рейсов)\",\"tailTransfer\":\". Прямых рейсов нет — сравните перевозчиков и удобные стыковки ниже.\",\"tailDirect\":\". Сравните перевозчиков, доли рейсов и расписание ниже.\"},\"faq\":{\"durationQ\":\"Сколько лететь из {fromGen} в {toAcc}?\",\"durationATransfer\":\"Прямых рейсов нет, поэтому время в пути зависит от стыковки{via}. По данным поиска, весь путь занимает около {duration} с учётом пересадки.\",\"durationADirect\":\"Перелёт {from} — {to} без пересадок занимает примерно {duration}{distance}.\",\"durationVia\":\" в {via}\",\"durationDistance\":\" — расстояние между городами около {km} км\",\"distanceQ\":\"Сколько километров от {fromGen} до {toGen}?\",\"distanceA\":\"Расстояние от {fromGen} до {toGen} — около {km} км{flight}.\",\"distanceFlightPart\":\", прямой рейс преодолевает его примерно за {duration}\",\"directQ\":\"Есть ли прямые рейсы {from} — {to}?\",\"directATransfer\":\"Беспересадочных рейсов на маршруте нет — билеты продаются только с пересадкой{via}.\",\"directAYes\":\"Да, на маршруте {from} — {to} есть прямые рейсы без пересадок{weekly}.\",\"directVia\":\" (обычно через {via})\",\"directWeekly\":\" — всего около {flights} в неделю\",\"airlinesQ\":\"Какие авиакомпании летают {from} — {to}?\",\"airlinesA\":\"На маршруте {from} — {to} выполняют рейсы {list}. Полный список с расписанием — в разделе «Авиакомпании» на странице.\",\"airportsQ\":\"Из каких аэропортов выполняются рейсы {from} — {to}?\",\"airportsBoth\":\"Рейсы из {from} вылетают из {fromList}, прилетают в {toList}. Если в городе несколько аэропортов, перед поездкой проверьте, какой указан в билете.\",\"airportsFromOnly\":\"Рейсы из {from} вылетают из {fromList}. Если в городе несколько аэропортов, перед поездкой проверьте, какой указан в билете.\",\"airportsToOnly\":\"Рейсы {from} — {to} прилетают в {toList}. Если в городе несколько аэропортов, перед поездкой проверьте, какой указан в билете.\",\"cheapestQ\":\"Как найти дешёвые авиабилеты {from} — {to}?\",\"cheapestA\":\"Чтобы поймать низкую цену {from} — {to}, бронируйте за несколько недель, будьте гибкими с датами и сравнивайте авиакомпании и варианты с пересадкой. Календарь низких цен и график цен по месяцам на этой странице сразу показывают самые дешёвые дни и месяцы{cheap}.\",\"cheapestMonthPart\":\": самый бюджетный месяц для перелёта — обычно {month}\",\"arriveEarlyQ\":\"За сколько приезжать в аэропорт?\",\"arriveEarlyA\":\"На международные рейсы приезжайте в аэропорт примерно за 2–3 часа до вылета, на внутренние — примерно за час. В высокий сезон и в крупных аэропортах закладывайте дополнительное время: очереди на регистрацию и досмотр бывают длиннее.\",\"priceQ\":\"Сколько стоит билет {from} — {to}?\",\"priceA\":\"Цена билета {from} — {to} зависит от даты вылета, сезона и спроса{cheap}{peak}.{range} Актуальный минимум и календарь низких цен — на этой странице.\",\"priceCheap\":\": дешевле всего лететь обычно в {month}\",\"pricePeak\":\", дороже всего — в {month}\",\"priceRange\":\" Обычно билеты обходятся от {low} до {high}.\",\"bookQ\":\"Когда лучше покупать билеты {from} — {to}?\",\"bookA\":\"Билеты {from} — {to} обычно выгоднее брать заранее — за несколько недель до вылета и вне пиковых дат{cheap}. Сравните цены по месяцам в графике динамики на этой странице.\",\"bookCheap\":\"; самый бюджетный месяц для перелёта — {month}\",\"arrivalQ\":\"В какой аэропорт прилетает рейс в {toAcc}?\",\"arrivalA\":\"У {toAcc} нет собственного аэропорта — ближайший это {airport} ({iata}), рейсы прибывают туда.\"},\"lingua\":{\"weekdays\":[\"воскресеньям\",\"понедельникам\",\"вторникам\",\"средам\",\"четвергам\",\"пятницам\",\"субботам\"],\"weekdayPrefix\":\"по \",\"weekdayConj\":\" и \",\"weekdayDaily\":\"ежедневно\",\"flightsCount\":\"{count, plural, one {# рейс} few {# рейса} many {# рейсов} other {# рейса}}\",\"airlinesCount\":\"{count, plural, one {# авиакомпания} few {# авиакомпании} many {# авиакомпаний} other {# авиакомпании}}\"}}},\"cityV2\":{\"page\":{\"attractions\":\"Достопримечательности\",\"nearbyCities\":\"Ближайшие города\"},\"nearby\":{\"title\":\"Города рядом\",\"distanceKm\":\"{km} км\"},\"transport\":{\"airports\":\"Аэропорты\",\"railways\":\"Вокзалы\",\"distanceKm\":\"{km} км\"},\"blockAttractions\":{\"kitchen\":\"Где ещё поесть\",\"parksMuseums\":\"Ещё парки и музеи\",\"shopping\":\"Ещё для шопинга\",\"hotels\":\"Где ещё остановиться\",\"entertainment\":\"Ещё развлечения\",\"attractions\":\"Ещё достопримечательности\",\"fallback\":\"Ещё по теме\"}},\"flightsHub\":{\"searching\":\"Поиск...\",\"breadcrumbHome\":\"Главная\",\"allDestinationsTitle\":\"Все направления\",\"title\":\"Авиабилеты\",\"heading\":\"Дешёвые авиабилеты\",\"introText\":\"Сравнивайте цены на авиабилеты от сотен авиакомпаний и покупайте билеты на самолёт по выгодной цене. Находите дешёвые перелёты по всему миру — прямые рейсы и с пересадками, в одну сторону и туда-обратно, эконом и бизнес-класс.\",\"searchFromPlaceholder\":\"Город вылета\",\"searchToPlaceholder\":\"Город прибытия\",\"searchTitle\":\"Найти направление\",\"popularRoutesTitle\":\"Популярные направления\",\"popularRoutesSubtitle\":\"Куда чаще всего летают — выберите маршрут и смотрите цены\",\"viewRoute\":\"Смотреть маршрут\",\"noRouteFound\":\"Лендинг для этого маршрута пока не создан\",\"searchOnSite\":\"Найти билеты\",\"faqTitle\":\"Часто задаваемые вопросы\",\"faq1q\":\"Как найти дешёвые авиабилеты?\",\"faq1a\":\"Сравнивайте предложения нескольких авиакомпаний, используйте гибкие даты и бронируйте заранее — за 4–8 недель для внутренних рейсов и за 2–3 месяца для международных.\",\"faq2q\":\"Когда лучше покупать авиабилеты?\",\"faq2a\":\"Цены обычно ниже в низкий сезон и при вылете в будние дни. Отслеживайте динамику цен и подписывайтесь на уведомления о снижении.\",\"faq3q\":\"Можно ли найти прямые рейсы?\",\"faq3a\":\"Да, используйте фильтр «Прямые рейсы» при поиске. Если прямых рейсов нет, мы покажем варианты с минимальным количеством пересадок.\",\"gridDestinationsFrom\":\"Направления из {city}\",\"gridFlightsTo\":\"Рейсы в {city}\",\"gridPopularTitle\":\"Популярные направления\",\"gridLoading\":\"Загрузка...\",\"gridLoadError\":\"Не удалось загрузить направления\",\"gridEmpty\":\"Направления не найдены\",\"gridFlightsPerWeek\":\"{count} рейсов/нед.\",\"gridSeeAllFrom\":\"Смотреть все направления из {city}\",\"popularFromTitle\":\"Популярные города вылета\",\"allCitiesLink\":\"Все города вылета\",\"gridPriceFrom\":\"От {price}\",\"gridCheckPrice\":\"Уточнить цену\"},\"flightsFromCity\":{\"reviewsTitle\":\"Отзывы о перелётах из {city}\",\"reviewsSubtitle\":\"Впечатления путешественников, летавших из {city}\",\"title\":\"Дешёвые авиабилеты из {city}\",\"destinationsTitle\":\"Популярные направления из {city}\",\"breadcru
