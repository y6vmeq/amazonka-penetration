function hideSpinner() {

function unhideSpinner() {
	document.getElementById('captcha-spinner').classList.remove('captcha-hidden');

function hideCaptcha() {

function unhideCaptcha() {

var captchaParentOrigin = '';

	r.onreadystatechange = function(){
		if (r.readyState === XMLHttpRequest.DONE) {
			onDone(r.status, r.responseText);
		}
	};

	r.send(body);
