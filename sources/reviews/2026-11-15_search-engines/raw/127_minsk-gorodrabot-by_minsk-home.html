<!DOCTYPE html><html><head><title>Проверка CAPTCHA</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}.captcha-container{background:white;border-radius:24px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:500px;width:100%;text-align:center;}h2{color:#333;margin-bottom:15px;font-size:28px;}.description{color:#666;margin-bottom:30px;line-height:1.5;}cap-widget{display:flex;justify-content:center;margin:20px 0;}.message{margin-top:20px;padding:12px;border-radius:8px;font-size:14px;display:none;}.message.show{display:block;animation:fadeIn 0.3s ease;}.message.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}@keyframes fadeIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}.loading{display:inline-block;width:20px;height:20px;border:2px solid #ddd;border-radius:50%;border-top-color:#667eea;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle;}@keyframes spin{to{transform:rotate(360deg);}}</style></head><body><div class="captcha-container"><h2>🔒 Проверка безопасности</h2><p class="description">Пожалуйста, подтвердите что вы не робот</p><script src="https://cdn.jsdelivr.net/npm/@cap.js/widget"></script><cap-widget id="cap-widget" data-cap-api-endpoint="https://cap.gorodrabot.ru/97e1709727/"></cap-widget><div id="message" class="message"></div></div><script>var returnUrl="/";var isProcessing=false;var messageDiv=document.getElementById("message");var widget=document.getElementById("cap-widget");function showMessage(type,text){messageDiv.className="message show "+type;messageDiv.innerHTML=text;setTimeout(function(){messageDiv.classList.remove("show")},5000)}function submitCaptcha(token){if(isProcessing)return;isProcessing=true;showMessage("info",'<span class="loading"></span> Проверка...');fetch("/?captcha_token="+encodeURIComponent(token)+"&return_url="+encodeURIComponent(returnUrl)).then(function(response){if(response.ok){window.location.href=returnUrl}else{showMessage("error","❌ Ошибка проверки капчи");isProcessing=false}}).catch(function(){showMessage("error","❌ Ошибка сети");isProcessing=false})}if(widget){widget.addEventListener("solve",function(e){if(e.detail&&e.detail.token){submitCaptcha(e.detail.token)}else{showMessage("error","❌ Ошибка верификации");isProcessing=false}});widget.addEventListener("error",function(){showMessage("error","❌ Ошибка загрузки капчи");isProcessing=false})}else{showMessage("error","❌ Не удалось загрузить виджет")}</script></body></html>
